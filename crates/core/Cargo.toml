# Pure Rust. No UI, no windowing, no platform assumptions -- the whole point is
# that a front end is swappable, and that only holds if this crate cannot reach
# for one. It must stay wasm32-clean so a browser front end is a real option.
[package]
name = "tagpad-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "input"
harness = false
